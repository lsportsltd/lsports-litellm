environment_variables:
  # Swagger UI / Redoc URLs are fixed at process start from os.environ (see LiteLLM
  # proxy_cli import order). Set NO_DOCS and NO_REDOC on the container/Pod env too.
  NO_DOCS: true
  NO_REDOC: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  forward_client_headers_to_llm_api: true
  block_robots: true

  admin_only_routes:
    - "/key/generate"
    - "/key/delete"
    - "/user/new"
    - "/model/new"
    - "/spend/*"
    - "/ui/*"

litellm_settings:
  drop_params: true
  set_verbose: false
  store_audit_logs: true
  redact_messages_in_exceptions: true
  redact_user_api_key_info: true
  filter_invalid_headers: true
  log_raw_request_response: false
  # Module-level HTTP client timeout (seconds). Default in library is very high; this caps hung calls.
  request_timeout: 300
  # Path is relative to the config file directory (/app -> src/llm/callbacks.py).
  callbacks:
    - src.llm.callbacks.sports_betting_guard_instance

