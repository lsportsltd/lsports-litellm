replicaCount: 1
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"
ingress:
- enabled: true
  hosts:
  - host: stm-litellm.qa-trd.lsports-gcp.cloud
    paths:
    - path: /
      backend:
        servicePort: 4000
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: instance.type
          operator: In
          values:
          - general
envSecretGcp:
  LITELLM_MASTER_KEY: _manual_stm_litellm_master_key
  DATABASE_URL: _manual_stm_litellm_database_url
  LITELLM_LICENSE: _manual_stm_litellm_license
  FRONTEGG_AUTHORIZATION_TOKEN: _manual_stm_litellm_authorization_token
  FRONTEGG_CLIENT_ID: _manual_stm_frontegg_client_id
  FRONTEGG_TOKEN_URL: _manual_stm_litellm_token_url
env:
  ACE_BOOST_MCP_URL: https://stm-mcp-customers.qa-trd.lsports-gcp.cloud/ace-bps/mcp
  TRADE_CUSTOMER_MCP_URL: https://stm-mcp-customers.qa-trd.lsports-gcp.cloud/trd_customers/mcp
  ENVIRONMENT: qa
  GCP_PROJECT_ID: lsports-qa-trd
  GCP_REGION: europe-west1
