replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
    cpu: 500m
ingress:
- enabled: true
  hosts:
  - host: innovation-litellm.qa-innovation.lsports-gcp.cloud
    paths:
    - path: /
      backend:
        servicePort: 4000
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: instance.type
          operator: In
          values:
          - general

