replicaCount: 1

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

ingress:
  enabled: true
  annotations:
    kubernetes.io/tls-acme: "true"
  hostnames:
    - stm-litellm.prod-trd.lsports-gcp.cloud
    - boost-mcp.lsports.eu
    - trade-mcp.lsports.eu
  hosts:
    - host: stm-litellm.prod-trd.lsports-gcp.cloud
      paths:
        - path: /
          backend:
            servicePort: 4000
    - host: boost-mcp.lsports.eu
      paths:
        - path: /
          backend:
            servicePort: 4000
    - host: trade-mcp.lsports.eu
      paths:
        - path: /
          backend:
            servicePort: 4000

ingress_route:
  enable: true
  port: 4000
  host: "boost-mcp.lsports.eu"
  override_match: "(Host(`boost-mcp.lsports.eu`) || Host(`trade-mcp.lsports.eu`) || Host(`stm-litellm.prod-trd.lsports-gcp.cloud`)) && (PathPrefix(`/`))"
  customHeaders:
    X-Forwarded-Proto: https

gke:
  istio:
    services:
      - hosts:
          - stm-litellm.prod-trd.lsports-gcp.cloud
          - boost-mcp.lsports.eu
          - trade-mcp.lsports.eu
        sticky:
          enabled: true
        port: 4000
        gateway: "istio-ingress/istio-gateway-public"
        name: stm-litellm

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: instance.type
              operator: In
              values:
                - general

envSecretGcp:
  LITELLM_MASTER_KEY: _manual_stm_litellm_master_key
  DATABASE_URL: _manual_stm_litellm_database_url
  LITELLM_LICENSE: _manual_stm_litellm_license
  FRONTEGG_AUTHORIZATION_TOKEN: _manual_stm_litellm_authorization_token
  FRONTEGG_CLIENT_ID: _manual_stm_frontegg_client_id
  FRONTEGG_TOKEN_URL: _manual_stm_litellm_token_url
env:
  ACE_BOOST_MCP_URL: https://stm-mcp-customers.prod-trd.lsports-gcp.cloud/ace-bps/mcp
  TRADE_CUSTOMER_MCP_URL: https://stm-mcp-customers.prod-trd.lsports-gcp.cloud/trd_customers/mcp
  ENVIRONMENT: prod
  GCP_PROJECT_ID: lsports-prod-trd
  GCP_REGION: europe-west1
