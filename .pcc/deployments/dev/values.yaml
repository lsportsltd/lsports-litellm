replicaCount: 1
resources:
  requests:
    memory: "4Gi"
    cpu: "2"
  limits:
    memory: "8Gi"
    cpu: "4"
ingress:
- enabled: true
  hosts:
  - host: innovation-litellm.dev-innovation.lsports-gcp.cloud
    paths:
    - path: /
      backend:
        servicePort: 4000
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: instance.type
          operator: In
          values:
          - general
envSecretGcp:
  LITELLM_MASTER_KEY: _innovation_litellm_master_key
  DATABASE_URL: _innovation_litellm_database_url
  LITELLM_LICENSE: _innovation_litellm_license
  